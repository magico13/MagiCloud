name: Main CI
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # Build, test, and publish the code
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: '10.x'
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Test
      run: dotnet test --no-build --verbosity normal

    # Publish MagiCloud
    - name: Publish MagiCloud
      run: dotnet publish MagiCloud/MagiCloud.csproj -c Release -o ./publish-magicloud -r linux-x64 --self-contained false
    - name: Upload MagiCloud artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: magicloud
        path: ./publish-magicloud
        retention-days: 7

    # Publish GogglesApi
    - name: Publish GogglesApi
      run: dotnet publish GogglesApi/GogglesApi.csproj -c Release -o ./publish-goggles -r linux-x64 --self-contained false
    - name: Upload Goggles artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: goggles
        path: ./publish-goggles
        retention-days: 7

  docker:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Download MagiCloud artifact
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: magicloud
        path: ./publish-magicloud
    - name: Download Goggles artifact
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: goggles
        path: ./publish-goggles

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Login to Docker Hub
      uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
      with:
        username: ${{ vars.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push MagiCloud image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: ./publish-magicloud
        file: ./Dockerfile
        push: true
        tags: |
          ${{ vars.DOCKER_USERNAME }}/magicloud:latest
          ${{ vars.DOCKER_USERNAME }}/magicloud:${{ github.sha }}

    - name: Build and push Goggles image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: ./publish-goggles
        file: ./Goggles.dockerfile
        push: true
        tags: |
          ${{ vars.DOCKER_USERNAME }}/goggles:latest
          ${{ vars.DOCKER_USERNAME }}/goggles:${{ github.sha }}
